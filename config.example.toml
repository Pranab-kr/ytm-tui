# ytm-cli configuration
#
# Copy to the platform config dir and edit:
#   Linux:   ~/.config/ytm-cli/config.toml
#   macOS:   ~/Library/Application Support/ytm-cli/config.toml
#
# Every key below is shown with its built-in default, so a commented-out file
# behaves exactly like no file at all. Uncomment a line to change it.
#
# Two ways in:
#   ytm-cli config          write this file and open it in $EDITOR
#   ,                       same thing from inside the app
# Keybindings and the theme reload when you save and exit — no restart.

[auth]
# Browser cookies are the only way to reach your own account. (The OAuth device
# flow was removed: Google stopped honouring device-flow tokens on the endpoints
# this app uses, so it could never reach your library.)
#
# They are optional. Without them the app starts in guest mode: search, the
# queue, and playback work, while Home/Playlists/Fav/Albums/Artists and playlist
# editing are dimmed until a cookie file is set.
kind = "cookie"

# A file holding the raw `Cookie:` request header value from a signed-in
# music.youtube.com request — one line, and it must contain `SAPISID=`. This is
# NOT Netscape cookies.txt format; the contents are sent verbatim as the header.
#
# Export it from a PRIVATE / INCOGNITO window: a normal session rotates its
# cookies and the export stops working within hours. Full steps, including the
# two easy-to-miss ones (Shift+click reload, and close the window WITHOUT
# signing out), are in the README's "Authentication" section.
#
# The same file is used for playback — yt-dlp needs cookies too, and the app
# converts the header into the format it wants automatically.
cookie_file = "~/.config/ytm-cli/cookies.txt"

[playback]
volume = 70        # 0-100, the starting level; +/- changes are remembered
shuffle = false    # start shuffled

[ui]
vim_keys = true    # h/j/k/l navigation alongside the arrows; false drops those four only
mouse = true       # scroll wheel scrolls; left click selects, right click queues

# Which source the app opens on: "playlists" (default), "home", "fav",
# "albums", "artists", "search", or "queue". "home" fetches several pages of
# recommendations, so it costs a moment more before the first useful frame.
start_pane = "playlists"
tick_ms = 250      # redraw interval; lower is smoother and busier
album_art = true   # art in graphics-capable terminals (kitty, iTerm2, sixel)

# Built-in theme: "auto", "tokyonight", "gruvbox", "nord", "dracula",
# "dawn" (light), or "paper" (light). "auto" reads the terminal background and
# falls back to dark when it cannot tell. Press `t` to cycle at runtime.
theme = "auto"

# Override just the accent, whichever theme is active.
# accent = "#7aa2f7"

# A full custom theme file wins over `theme` above. Keys: accent, fg, fg_dim,
# fg_bright, bg_sel, error, success, and `preset` to start from a built-in.
# theme_file = "~/.config/ytm-cli/theme.toml"
# Automatically reload `theme_file` when it changes on disk.
# auto_reload_theme = false

[behaviour]
seek_step_secs = 5    # how far f/b jump
volume_step = 5       # how much +/- move the volume
confirm_on_quit = false

[storage]
# Directory where permanently downloaded songs are kept.
# Tilde expansion (~/...) is supported.
# download_dir = "~/Music/ytm"
cache_size_mb = 1024  # max MB for lookahead cache
prefetch_count = 2    # number of queue tracks to prefetch ahead

# Rebind any action to a single character. Action names are the snake_case forms
# below; a binding is exclusive, so setting one clears that action's default.
[keys]
# down = "j"
# up = "k"
# left = "h"
# right = "l"
# home = "g"
# end = "G"
# quit = "q"
# open_help = "?"
# open_search = "S"      # search YouTube Music (in Artists, searches artists)
# open_filter = "/"      # filter the rows already on screen
# open_queue = "u"
# toggle_pause = " "
# next_track = "n"
# prev_track = "p"
# seek_forward = "f"
# seek_back = "b"
# volume_up = "+"
# volume_down = "-"
# toggle_mute = "m"
# toggle_shuffle = "s"
# cycle_repeat = "r"
# add_to_queue = "a"
# play_next = "e"
# add_to_playlist = "A"
# create_playlist = "N"
# rename_playlist = "R"
# delete_playlist = "D"
# remove_from_playlist = "x"
# toggle_mark = "v"
# toggle_visual = "V"
# move_entry_down = "J"
# move_entry_up = "K"
# clear_queue = "C"
# refresh = "L"
# center_on_cursor = "z" # `zz` centres the selected row (press twice)
# focus_current = "c"     # select and reveal the playing song
# page_down = "d"        # also Ctrl+D / PageDown
# page_up = "u"          # also Ctrl+U / PageUp
# cycle_theme = "t"
# edit_config = ","

# Not remappable, listed so they are discoverable:
#   1-7          jump to a source (Home, Playlists, Fav, Albums, Artists,
#                Search, Queue)
#   tab          next source
#   zz           centre the selected row
#   ^d / ^u      half page down / up
#   ^w           delete the previous word, in a text field
#   ^left/right  move a word, in a text field
#   ^a / ^e      start / end of line, in a text field
#   wheel        scroll the focused list
#   left click   select a row, or switch source in the sidebar
#   right click  add the row under the pointer to the queue
